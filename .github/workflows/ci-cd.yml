name: CI/CD

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
        working-directory: backend

      - name: Run tests
        run: python -m pytest
        working-directory: backend

      - name: Build Docker image
        run: docker build --tag ares-api:test ./backend

  publish:
    name: Publish image to GHCR
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/suba12-ux/ares" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: ares-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      IMAGE_REF: ${{ needs.publish.outputs.image }}:${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment settings and configure SSH
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Set the DEPLOY_HOST environment variable}"
          : "${DEPLOY_USER:?Set the DEPLOY_USER environment variable}"
          : "${DEPLOY_PATH:?Set the DEPLOY_PATH environment variable}"
          : "${DEPLOY_PORT:?Set the DEPLOY_PORT environment variable}"
          : "${DEPLOY_SSH_KEY:?Set the DEPLOY_SSH_KEY secret}"
          : "${DEPLOY_KNOWN_HOSTS:?Set the DEPLOY_KNOWN_HOSTS secret}"

          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || {
            echo "DEPLOY_HOST must be an IPv4 address or hostname." >&2
            exit 1
          }
          [[ "$DEPLOY_USER" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "DEPLOY_USER contains unsupported characters." >&2
            exit 1
          }
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] && (( DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535 )) || {
            echo "DEPLOY_PORT must be a TCP port from 1 to 65535." >&2
            exit 1
          }
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ && "$DEPLOY_PATH" != "/" ]] || {
            echo "DEPLOY_PATH must be a non-root absolute path without spaces." >&2
            exit 1
          }
          [[ "$DEPLOY_PATH" != *"/../"* && "$DEPLOY_PATH" != */.. ]] || {
            echo "DEPLOY_PATH must not contain parent-directory segments." >&2
            exit 1
          }

          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ares-deploy-key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ares-known-hosts"
          chmod 600 "$RUNNER_TEMP/ares-deploy-key" "$RUNNER_TEMP/ares-known-hosts"

      - name: Upload Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(
            -i "$RUNNER_TEMP/ares-deploy-key"
            -p "$DEPLOY_PORT"
            -o UserKnownHostsFile="$RUNNER_TEMP/ares-known-hosts"
            -o StrictHostKeyChecking=yes
            -o BatchMode=yes
          )
          scp_options=(
            -i "$RUNNER_TEMP/ares-deploy-key"
            -o UserKnownHostsFile="$RUNNER_TEMP/ares-known-hosts"
            -o StrictHostKeyChecking=yes
            -o BatchMode=yes
          )
          target="$DEPLOY_USER@$DEPLOY_HOST"
          ssh "${ssh_options[@]}" "$target" bash -s -- "$DEPLOY_PATH" <<'REMOTE'
          set -euo pipefail
          mkdir -p "$1"
          REMOTE
          scp -P "$DEPLOY_PORT" "${scp_options[@]}" \
            compose.yaml "$target:$DEPLOY_PATH/compose.yaml"

      - name: Deploy image and check health
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(
            -i "$RUNNER_TEMP/ares-deploy-key"
            -p "$DEPLOY_PORT"
            -o UserKnownHostsFile="$RUNNER_TEMP/ares-known-hosts"
            -o StrictHostKeyChecking=yes
            -o BatchMode=yes
          )
          target="$DEPLOY_USER@$DEPLOY_HOST"

          ssh "${ssh_options[@]}" "$target" \
            bash -s -- "$DEPLOY_PATH" "$IMAGE_REF" <<'REMOTE'
          set -euo pipefail
          deploy_path=$1
          image_ref=$2
          cd "$deploy_path"

          previous_image=""
          previous_container="$(docker compose -f compose.yaml ps --all --quiet api | head -n 1)"
          if [ -n "$previous_container" ]; then
            previous_image="$(docker inspect --format '{{.Config.Image}}' "$previous_container")"
          fi

          ARES_IMAGE="$image_ref" docker compose -f compose.yaml pull api
          if ! ARES_IMAGE="$image_ref" docker compose -f compose.yaml up \
            --detach --no-build --wait --wait-timeout 60 api; then
            echo "Deployment health check failed." >&2
            docker compose -f compose.yaml logs --no-color --tail=100 api >&2 ||
              echo "Could not retrieve API logs." >&2
            if [ -n "$previous_image" ]; then
              echo "Attempting rollback to $previous_image." >&2
              ARES_IMAGE="$previous_image" docker compose -f compose.yaml up \
                --detach --no-build --wait --wait-timeout 60 api ||
                echo "Rollback failed; inspect the server's Docker Compose logs." >&2
            fi
            exit 1
          fi
          REMOTE
